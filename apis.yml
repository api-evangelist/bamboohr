- aid: bamboohr:webhooks
  name: BambooHR Webhooks
  description: >-
    Event-driven webhook surface for BambooHR. Webhooks fire when monitored fields change on Employee
    records (and when employee records are created or deleted). Subscribers register an HTTPS URL per
    monitored field; BambooHR POSTs an event-based or field-based JSON payload carrying the employee identifier
    and the list of changed fields, signed with an SHA-256 HMAC.
  humanURL: https://documentation.bamboohr.com/docs/webhooks
  tags:
  - Webhooks
