apis:
- aid: bamboohr:rest-api
  name: BambooHR REST API
  description: >-
    RESTful HTTPS API for accessing and manipulating employee data, directories, time-off, reports, and
    other BambooHR HRIS resources. Supports OAuth 2.0 for multi-customer apps and API key (HTTP Basic)
    for single-customer integrations.
  humanURL: https://documentation.bamboohr.com/docs
  baseURL: https://api.bamboohr.com/api/gateway.php
