aid: bamboohr
name: BambooHR
description: BambooHR is a cloud-based human resources software platform for small
  and medium-sized businesses, providing core HR, applicant tracking, onboarding,
  time tracking, payroll, performance management, and employee self-service. The BambooHR
  REST API allows developers to read and update employee data, generate reports, manage
  time-off, and integrate with the HRIS using either OAuth 2.0 or per-customer API
  keys over HTTPS Basic Auth.
